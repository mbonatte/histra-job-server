name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: histra
          POSTGRES_USER: histra
          POSTGRES_PASSWORD: histra-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U histra -d histra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://histra:histra-ci-password@127.0.0.1:5432/histra
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: PostgreSQL API smoke test
        run: python scripts/postgres_smoke.py
      - name: Build container
        run: docker build --tag histra-job-server:test .
