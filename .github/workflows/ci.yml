name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: histra
          POSTGRES_USER: histra
          POSTGRES_PASSWORD: histra-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U histra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    
    env:
      DATABASE_URL: postgresql+psycopg://histra:histra-ci-password@127.0.0.1:5432/histra
      STORAGE_ROOT: ${{ runner.temp }}/histra-artifacts
    
    steps:
      - name: Check out HiStrA Job Server
        uses: actions/checkout@v4
        with:
          path: histra-job-server
          persist-credentials: false
      
      - name: Check out HiStrA Job Builder
        uses: actions/checkout@v4
        with:
          repository: mbonatte/histra-job-builder
          ref: main
          path: histra-job-builder
          persist-credentials: false
      
      - name: Check out HiStrA Job Runner
        uses: actions/checkout@v4
        with:
          repository: mbonatte/histra-job-runner
          ref: main
          path: histra-job-runner
          persist-credentials: false
      
      - name: Create artifact storage
        run: mkdir -p "$STORAGE_ROOT"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            histra-job-server/pyproject.toml
            histra-job-builder/pyproject.toml
            histra-job-runner/pyproject.toml
      
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./histra-job-builder
      - run: python -m pip install -e ./histra-job-runner
      - run: python -m pip install -e './histra-job-server[test,postgres]'
      
      - name: Run tests
        working-directory: histra-job-server
        run: |
          python -m pytest \
            --cov=histra_server \
            --cov-report=term-missing
