name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: workspace/histra-job-server
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          repository: mbonatte/histra-job-builder
          ref: main
          path: workspace/histra-job-builder
      - name: Checkout runner for acceptance tests
        uses: actions/checkout@v4
        with:
          repository: mbonatte/histra-job-runner
          ref: v1.0.0
          path: workspace/histra-job-runner
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "workspace/histra-job-runner" -e "workspace/histra-job-builder[test]" -e "workspace/histra-job-server[test]"
      - working-directory: workspace/histra-job-server
        run: pytest --cov=histra_server --cov-report=term-missing
      - run: python -m compileall -q workspace/histra-job-runner/src workspace/histra-job-builder/src workspace/histra-job-server/src
      - run: node --check workspace/histra-job-server/src/histra_server/static/shared.js
      - run: node --check workspace/histra-job-server/src/histra_server/static/dashboard.js
      - run: node --check workspace/histra-job-server/src/histra_server/static/builder.js
