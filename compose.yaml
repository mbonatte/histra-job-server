services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: histra
      POSTGRES_USER: histra
      POSTGRES_PASSWORD: histra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U histra"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: histra-job-server/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./templates:/data/templates:ro
      - package-cache:/tmp/histra-packages
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  package-cache:
