[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-server"
version = "0.1.4"
description = "Containerised FastAPI job server for distributed HiStrA analyses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi[standard]>=0.128,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.50,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP040"]
