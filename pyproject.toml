[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "histra-job-server"
version = "1.0.0"
description = "JOB queue, ephemeral HRX packaging, leases, and result provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "histra-job-builder>=1.0.0,<2",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
histra-server = "histra_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/histra_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_server"]

[tool.coverage.report]
show_missing = true
fail_under = 85
