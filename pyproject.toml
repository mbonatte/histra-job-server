[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-server"
version = "1.0.0"
description = "JOB queue, ephemeral HRX packaging, leases, and result provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "histra-job-builder",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
histra-server = "histra_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_server"]
omit = ["src/histra_server/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
