[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-server"
version = "1.1.0"
description = "Canonical HiStrA job server with dashboard and HRX/JOB builder UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Maurício Bonatte"}]
dependencies = [
  "fastapi>=0.115",
  "histra-job-builder==1.1.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
test = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5"]
dev = ["ruff>=0.6"]

[project.scripts]
histra-server = "histra_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
histra_server = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_server"]
omit = ["src/histra_server/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
